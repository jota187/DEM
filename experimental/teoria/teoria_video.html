<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vídeo: Ensino Experimental em Ciências</title>
<link rel="icon" type="image/png" href="favicon_experimental.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--accent:#10b981;
  --text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --bg:#fafaf8;--surface:#ffffff;
  --radius:10px;
  --shadow:0 1px 3px rgb(0 0 0/.08);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}

/* ── Page layout ── */
.teoria-page{max-width:760px;margin:0 auto;padding:28px 28px 72px}

/* ── Chapter header ── */
.chapter-head{margin-bottom:28px}
.chapter-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:6px}
.chapter-head h1{font-size:1.62rem;font-weight:800;letter-spacing:-.4px;line-height:1.25;color:var(--text);margin-bottom:10px}
.chapter-divider{height:3px;width:56px;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px}

/* ── Article typography ── */
article p{margin-bottom:1em;font-size:1rem}
article ul,article ol{margin:0 0 1em 1.4em}
article li{margin-bottom:.35em}
article h2{font-size:1.15rem;font-weight:700;color:var(--text);margin:1.8em 0 .6em;letter-spacing:-.2px}
article h3{font-size:1rem;font-weight:700;color:var(--primary);margin:1.4em 0 .4em}
article strong{color:#0f172a}

/* ── Video ── */
.video-wrap{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-md,0 4px 16px rgb(0 0 0/.12));background:#000;margin:16px 0}
video{display:block;width:100%;max-height:480px}

/* ── Prev/Next navigation ── */
.page-nav{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}
.page-nav a{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text);transition:all .18s;white-space:nowrap}
.page-nav a:hover{border-color:var(--primary);color:var(--primary);text-decoration:none;transform:translateY(-1px);box-shadow:0 4px 10px rgb(0 0 0/.08)}
.page-nav .spacer{flex:1}

/* ── Lightbox ── */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.open{display:flex;animation:lb-in .18s ease}
@keyframes lb-in{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:8px;box-shadow:0 12px 48px rgb(0 0 0/.5)}
.lightbox-close{position:fixed;top:18px;right:22px;color:#fff;font-size:1.8rem;cursor:pointer;opacity:.8;line-height:1;font-weight:300}
.lightbox-close:hover{opacity:1}

@media(max-width:600px){
  .teoria-page{padding:20px 16px 56px}
  .chapter-head h1{font-size:1.3rem}
  .page-nav{flex-wrap:wrap}
  .page-nav a{font-size:.82rem;padding:8px 14px}
}
</style>

</head>
<body>

<style>
.read-progress{
  position:fixed;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#2563eb,#10b981);
  width:0%;z-index:999;transition:width .1s linear;
}
</style>
<div class="read-progress" id="rp"></div>
<script>
window.addEventListener('scroll',function(){
  var d=document.documentElement;
  var pct=d.scrollTop/(d.scrollHeight-d.clientHeight)||0;
  document.getElementById('rp').style.width=(pct*100)+'%';
});
</script>

<div class="teoria-page">
  <header class="chapter-head">
    <p class="chapter-label">Teoria Experimental em Ciências</p>
    <h1>Vídeo: Ensino Experimental em Ciências</h1>
    <div class="chapter-divider"></div>
  </header>

  <article>
    <p>Vídeo de apoio sobre o ensino experimental em ciências. Use os controlos para reproduzir, pausar ou colocar em ecrã inteiro.</p>

    <div class="video-wrap">
      <video controls preload="metadata">
        <source src="videos/teoria_video.mp4" type="video/mp4">
        O seu navegador não suporta vídeo HTML5.
      </video>
    </div>
  </article>
  
  <nav class="page-nav">
    <a href="teoria_4.html">← 4. Papel do professor</a>
    <span class="spacer"></span><span></span>
  </nav>
</div>

<div class="lightbox" id="lb" onclick="closeLB()">
  <span class="lightbox-close">✕</span>
  <img id="lb-img" src="" alt="">
</div>

<script>
(function(){
  function openLB(src,alt){
    var lb=document.getElementById('lb');
    document.getElementById('lb-img').src=src;
    document.getElementById('lb-img').alt=alt||'';
    lb.classList.add('open');
    document.body.style.overflow='hidden';
  }
  window.closeLB=function(){
    document.getElementById('lb').classList.remove('open');
    document.body.style.overflow='';
  };
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLB();});
  document.querySelectorAll('.img-wrap').forEach(function(w){
    w.addEventListener('click',function(){
      var img=w.querySelector('img');
      openLB(img.src,img.alt);
    });
  });
})();

document.querySelectorAll('.page-nav a').forEach(function(a){
  a.addEventListener('click',function(){
    var file=a.href.split('/').pop();
    if(window.parent&&window.parent!==window){
      window.parent.postMessage({activePage:file},'*');
    }
  });
});
</script>

</body>
</html>
