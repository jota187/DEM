<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teoria Experimental em Ciências</title>
<link rel="icon" type="image/png" href="favicon_experimental.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--accent:#10b981;
  --text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --sidebar-w:280px;--topnav-h:52px;
  --sidebar-bg:#0f172a;--sidebar-active:#1e293b;
}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:#f8fafc;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}

/* ── Top breadcrumb nav ── */
.topnav{
  position:sticky;top:0;z-index:200;
  height:var(--topnav-h);
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;
  font-size:.88rem;flex-shrink:0;
}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted)}
.crumbs a{color:var(--muted);font-weight:500}
.crumbs a:hover{color:var(--primary)}
.crumbs .sep{opacity:.45}
.crumbs .current{color:var(--text);font-weight:600}
.topnav .actions{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;transition:all .18s}
.btn:hover{border-color:var(--primary);color:var(--primary);text-decoration:none;transform:translateY(-1px)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-dark);color:#fff}

/* ── App shell ── */
.shell{display:flex;flex:1;overflow:hidden;height:calc(100vh - var(--topnav-h))}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--sidebar-bg);
  display:flex;flex-direction:column;
  overflow:hidden;
  border-right:1px solid rgba(255,255,255,.06);
}
.sidebar-header{
  padding:20px 18px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-header h2{
  font-size:.95rem;font-weight:700;
  color:#f1f5f9;line-height:1.3;
  margin-bottom:4px;
}
.sidebar-header p{font-size:.75rem;color:#64748b}

.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}

.chapter-btn{
  display:flex;align-items:flex-start;gap:11px;
  width:100%;padding:12px 18px;
  background:transparent;border:none;
  color:#94a3b8;
  font:inherit;font-size:.84rem;line-height:1.4;
  text-align:left;cursor:pointer;
  border-left:3px solid transparent;
  transition:all .18s;
}
.chapter-btn:hover{background:rgba(255,255,255,.05);color:#e2e8f0}
.chapter-btn.active{
  background:rgba(37,99,235,.18);
  color:#fff;font-weight:600;
  border-left-color:#60a5fa;
}
.chapter-num{
  flex-shrink:0;
  width:22px;height:22px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  font-size:.72rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  color:#64748b;margin-top:1px;
  transition:all .18s;
}
.chapter-btn.active .chapter-num{
  background:var(--primary);color:#fff;
}

.sidebar-footer{
  padding:14px 18px;
  border-top:1px solid rgba(255,255,255,.08);
  font-size:.75rem;color:#475569;
}

/* ── Content iframe ── */
.content-area{flex:1;overflow:hidden;background:#fafaf8}
iframe.viewer{width:100%;height:100%;border:0;display:block}

/* ── Responsive ── */
@media(max-width:820px){
  .sidebar{width:100%;height:auto;max-height:48vh;border-right:none;border-bottom:1px solid rgba(255,255,255,.08)}
  .shell{flex-direction:column}
  iframe.viewer{height:calc(52vh)}
  .sidebar-nav{max-height:200px}
}
</style>
</head>
<body>

<nav class="topnav" aria-label="Navegação">
  <div class="crumbs">
    <a href="../../index.html">Início</a>
    <span class="sep">›</span>
    <a href="../experimental_index.html">Atividades Experimentais</a>
    <span class="sep">›</span>
    <span class="current">Teoria</span>
  </div>
  <div class="actions">
    <a class="btn" href="../experimental_index.html">↑ Atividades Experimentais</a>
    <a class="btn primary" href="../../index.html">🏠 Início</a>
  </div>
</nav>

<div class="shell">
  <aside class="sidebar" aria-label="Capítulos">
    <div class="sidebar-header">
      <h2>Teoria Experimental em Ciências</h2>
      <p>Selecione um capítulo</p>
    </div>
    <nav class="sidebar-nav" id="chapterNav">
      <button class="chapter-btn" data-file="teoria_intro.html" data-id="teoria_intro">
        <span class="chapter-num">◎</span>
        <span>Ensino Experimental em Ciências</span>
      </button>
      <button class="chapter-btn" data-file="teoria_1.html" data-id="teoria_1">
        <span class="chapter-num">1</span>
        <span>Grau de abertura e desenvolvimento da autonomia</span>
      </button>
      <button class="chapter-btn" data-file="teoria_2.html" data-id="teoria_2">
        <span class="chapter-num">2</span>
        <span>Carta de planificação: ferramenta central do professor</span>
      </button>
      <button class="chapter-btn" data-file="teoria_3.html" data-id="teoria_3">
        <span class="chapter-num">3</span>
        <span>Etapas do trabalho prático em contexto de sala de aula</span>
      </button>
      <button class="chapter-btn" data-file="teoria_4.html" data-id="teoria_4">
        <span class="chapter-num">4</span>
        <span>Papel do professor e evolução do grau de abertura</span>
      </button>
      <button class="chapter-btn" data-file="teoria_video.html" data-id="teoria_video">
        <span class="chapter-num">▶</span>
        <span>Vídeo: Ensino Experimental em Ciências</span>
      </button>
    </nav>
    <div class="sidebar-footer">© Didática do Estudo do Meio · J. Fonseca e Trindade</div>
  </aside>

  <section class="content-area">
    <iframe id="viewer" class="viewer" name="viewer" title="Conteúdo do capítulo" src="about:blank"></iframe>
  </section>
</div>

<script>
(function(){
  var btns = document.querySelectorAll('.chapter-btn');
  var viewer = document.getElementById('viewer');

  function activate(file, pushHash){
    btns.forEach(function(b){ b.classList.toggle('active', b.dataset.file===file); });
    if(viewer.src.split('/').pop() !== file) viewer.src = file;
    if(pushHash){
      var id = file.replace(/\.html$/, '');
      if(location.hash !== '#'+id) history.replaceState(null,'','#'+id);
    }
  }

  btns.forEach(function(b){
    b.addEventListener('click', function(){ activate(b.dataset.file, true); });
  });

  // Listen for prev/next messages from iframe
  window.addEventListener('message', function(e){
    if(e.data && e.data.activePage){
      var f = e.data.activePage;
      activate(f, true);
    }
  });

  // Initial load
  var hash = (location.hash||'').replace(/^#/,'');
  var match = Array.prototype.find.call(btns, function(b){ return b.dataset.id===hash; });
  activate(match ? match.dataset.file : btns[0].dataset.file, false);

  window.addEventListener('hashchange', function(){
    var id=(location.hash||'').replace(/^#/,'');
    var m=Array.prototype.find.call(btns,function(b){return b.dataset.id===id;});
    if(m) activate(m.dataset.file,false);
  });
})();
</script>
</body>
</html>
